# Production genesis: the launch market catalogue with its venue calendars,
# margins, spreads, and financing.
#
# This file is the [genesis] section of a production node config and nothing
# else. It is protocol: on first boot the node sequences it into the public log
# as admin commands. A full config is the deployment's [node], [logging],
# [tee], [operator], [custody] and [feeds] sections followed by this file.
#
# Launch values:
# - Markets: the majors of each asset class (#7, launch markets) and 20 US
#   large-cap shares.
# - Margin (#8, launch margin tables): professional-client levels, up to 200:1
#   (50 bps) on FX majors and major indices and lower on commodities, shares
#   and crypto, with bands that rise with position notional.
# - Fees (#9, launch fee schedule): a 10% profit fee, and financing markups
#   over the benchmark of 2.5% for indices, commodities and shares, 1% for FX,
#   and 5% for crypto.
# - Size spreads, stress levels, and the other protocol parameters are
#   config/dev.toml's (#9). A market dev.toml does not list takes its asset
#   class's size spreads, slippage bound, price rules, margin tables and house
#   cap, except SOL-USD's house cap: 10% of house NAV, set here below BTC's 30%
#   and ETH's 20%. Each market's financing benchmark is the rate of its base or
#   index currency, as dev.toml's EUR-USD uses ESTR, with that rate's day basis.
# - Margin and spread bands and house caps are in USD notional. USD-JPY,
#   Germany 40, UK 100 and Japan 225 are quoted in JPY, EUR, GBP and JPY at
#   their venues; their profit and loss accrues in the quote currency and
#   converts to USD at the engine's EUR-USD, GBP-USD and USD-JPY prices once
#   USD settlement (#70) lands. Until then the engine treats their prices as
#   USD.
# - Benchmark rates are not set here. The daily benchmark rates feature (#33)
#   sequences them; until then a benchmark with no rate counts as zero.
# - house_capital is 0: the house starts with no capital and builds it from
#   trader losses, so genesis credits none and the vault holds only trader
#   deposits. Exposure caps have no dollar floor yet; margin and solvency
#   checks (#45) add one so trading can start from a zero house (#15 §2).
#   Until then caps are a fraction of house NAV alone, so this genesis admits no
#   opening trade, and house utilisation reads as full, so every priced market
#   sits at the top stress level; the floor must cover the stress trigger too.
#
# Calendars. Each schedule uses its venue's time zone. `windows` are the weekly
# sessions, `closed_dates` whole local days the venue is shut, `closures`
# dated local [from, to) periods inside the windows (early closes, holiday
# halts, and closures that run past midnight), and `special_sessions` dated
# local periods the venue trades outside the windows. After launch, a calendar
# change is an UpsertMarket admin command carrying the market's new schedule;
# it applies from the seq it is sequenced at. A running node takes admin
# commands through the operator command channel (#47).
#
# Sourcing, as read on 2026-10-20. A venue's own publication decides, checked
# against a second, independent source. Where the venue has published nothing,
# two independent sources must agree; where they disagree, the schedule closes
# at the earliest time any of them gives. The independent sources are
# government holiday lists and two open-source calendar libraries,
# pandas_market_calendars 5.5.0 and exchange_calendars 4.13.2. Each venue below
# lists what is NOT VERIFIED by two sources.
#
# - US shares (ids 40-59): NYSE core session 09:30-16:00 ET, with its 2026 and
#   2027 holidays and 13:00 early closes:
#   https://www.nyse.com/markets/hours-calendars
#   Nasdaq observes the same holidays and publishes the same 2026 dates,
#   https://www.nasdaqtrader.com/Trader.aspx?id=Calendar ; its 2027 calendar
#   is not out. Both libraries (NYSE, NASDAQ, XNYS, XNAS) give the same hours,
#   holidays and early closes for both years. NYSE observes no New Year's Day
#   holiday on 31 Dec 2027, as 1 Jan 2028 is a Saturday.
# - FX (ids 10-13): Cboe FX spot, Sunday 17:00 to Friday 17:00 ET, closed on
#   Christmas Day and New Year's Day:
#   https://cdn.cboe.com/resources/fx/operation.pdf (section 22) and
#   https://www.cboe.com/about/hours/fx
#   pandas_market_calendars' FX calendar gives the same week, and its CME FX
#   calendar shuts from 17:00 ET the evening before 25 Dec 2026, 1 Jan 2027
#   and 24 Dec 2027 (Christmas Day on a Saturday). Cboe's trading day starts
#   at 17:00 ET, and it has not said whether a holiday closure follows it or
#   how it treats Christmas Day on a Saturday, so the schedule takes the
#   earlier close: shut from 17:00 ET the evening before each of those days.
#   NOT VERIFIED: that 17:00 ET start of each closure, and the closure on
#   24 Dec 2027.
# - US 500, US Tech 100, Wall St 30 (ids 20-22) and gold, silver, WTI
#   (ids 30-32): CME Globex, Sunday to Friday 17:00-16:00 CT with a daily
#   16:00-17:00 break, as CME's E-mini S&P 500, gold and crude oil pages give
#   it in search-engine excerpts and pandas_market_calendars (CME Globex
#   Equity, CMEGlobex_GC, _SI, _CL) gives it too:
#   https://www.cmegroup.com/trading-hours.html
#   CME finalises each holiday's hours about two weeks before it, so none for
#   2026-2027 is published. Both libraries (pandas_market_calendars and
#   exchange_calendars' CMES, COMEX and NYMEX) shut all six markets on
#   25 Dec 2026, 1 Jan 2027 and 24 Dec 2027, and metals and energy on Good
#   Friday 2027. They halt equity at 12:00 CT on Thanksgiving and on MLK,
#   Presidents', Memorial, Independence and Labor Days, and metals and energy
#   at 12:00 CT on Labor Day.
#   NOT VERIFIED, the libraries disagree and the schedule takes the earliest:
#   equity on 27 Nov 2026, 24 Dec 2026 and 26 Nov 2027 (12:00 or 12:15 CT),
#   Juneteenth 2027 (12:00 CT or no halt) and Good Friday 2027 (shut, or open
#   until 08:15 CT); metals and energy halts on every other holiday (12:00 CT,
#   or 12:45-13:45 CT) and on Juneteenth 2027 (13:30 CT, one library only).
# - Brent (id 33): ICE Futures Europe, 01:00-23:00 London Monday to Friday
#   with a 23:00 Sunday open, and its 2026 and 2027 holiday hours:
#   https://www.ice.com/products/219/brent-crude-futures and
#   https://www.ice.com/publicdocs/Trading_Schedule.pdf
#   ICE keeps these hours fixed to New York time: in the week UK and US clocks
#   differ it trades 00:00-22:00 GMT, 20:00-18:00 EDT,
#   https://www.ice.com/publicdocs/futures/Trading_Schedule_Temporary_Trading_Hours_for_DST.pdf
#   so the schedule is written in New York time. The early closes are the ET
#   times ICE prints beside the UK ones. On MLK Day and Presidents' Day 2027
#   ICE trades Brent at regular hours (status A), and on Thanksgiving 2027 it
#   closes at 14:30 ET (status C*), an hour later than in 2026. Both
#   libraries' ICE calendars (pandas_market_calendars ICE, exchange_calendars
#   IEPA) give the same 20:00-18:00 ET week and the same closures on
#   25 Dec 2026, 1 Jan 2027 and Good Friday 2027.
#   NOT VERIFIED, ICE's schedule is used where the libraries differ: their
#   20:00 ET Sunday open, against ICE's 23:00 London (18:00 ET); their
#   13:00 ET closes on US holidays, against ICE's 13:30-15:00 ET closes and
#   regular hours on MLK and Presidents' Days; their closure on 24 Dec 2027,
#   when ICE trades until 08:00 ET; and the hours for the weeks of 2027 when US
#   and UK clocks differ (14-27 March and 31 October-6 November), which ICE
#   has not published.
# - UK 100 (id 24): ICE Futures Europe FTSE 100 Index Future, 01:00-21:00
#   London, closed 25 and 28 Dec 2026:
#   https://www.ice.com/products/38716764/FTSE-100-Index-Future and
#   https://www.ice.com/publicdocs/futures/Trading_Schedule_Migrated_Liffe_Contracts.pdf
#   That schedule closes the future on every England and Wales bank holiday
#   of 2026 and covers 2026 only. The 2027 closures are the 2027 bank holidays,
#   https://www.gov.uk/bank-holidays.json , which both libraries' London
#   calendars (LSE, XLON) also close.
#   NOT VERIFIED: ICE's on-screen hours on 24 and 31 Dec 2026 and 2027. The
#   schedule closes at 12:30 with the London Stock Exchange, as both libraries
#   give; ICE's 2026 schedule names 13:00 for block trades only.
# - Germany 40 (id 23): Eurex DAX Futures, continuous trading to 22:00 Berlin,
#   from 01:10 CET in winter and 02:10 CEST in summer, and the 2026 closures:
#   https://www.eurex.com/ex-en/markets/idx/dax/DAX-Futures-139902 and
#   https://www.eurex.com/ex-en/trade/trading-calendar (2026 PDF)
#   Eurex fixes the open to UTC and the close to Berlin time, which one weekly
#   window cannot follow: the windows open at 02:10, and each CET weekday
#   Eurex trades has a 01:10-02:10 special session. 2027 closures are from the
#   indicative calendar, confirmed by the end of 2026:
#   https://www.eurex.com/ex-en/trade/trading-calendar/indicative-trading-calendars
#   and https://www.eurex.com/ex-en/trade/trading-calendar/holiday-regulations
#   exchange_calendars' XEUR closes the same days in both years.
#   NOT VERIFIED: the 01:10 CET / 02:10 CEST open, which only Eurex publishes;
#   FDAX hours on 30 Dec 2026, which Eurex has not published; and the final
#   2027 calendar.
# - Japan 225 (id 25): Osaka Exchange Nikkei 225 Futures, day session
#   08:45-15:45 and night session 17:00-06:00 Tokyo, as JPX's pages give them
#   in search-engine excerpts and QUICK gives them:
#   https://www.jpx.co.jp/english/derivatives/rules/trading-hours/index.html
#   https://corporate.quick.co.jp/en/japanmarketsview/equity/one-month-to-extension-of-tokyo-stock-exchange-trading-hours-new-market-close-system-to-be-introduced/
#   Japan's national holidays are the Cabinet Office's,
#   https://www8.cao.go.jp/chosei/shukujitsu/syukujitsu.csv , and JPX shuts
#   from 31 Dec to 3 Jan; both libraries' Tokyo calendars (JPX, XTKS) give the
#   same holidays and year-end. Closed 23 Nov 2026 and 20 Sep 2027 (BCP
#   tests), 31 Dec 2026 to 3 Jan 2027, and 31 Dec 2027.
#   NOT VERIFIED, from JPX's pages in search-engine excerpts only:
#   https://www.jpx.co.jp/english/derivatives/rules/holidaytrading/index.html
#   that Nikkei 225 futures trade both sessions on every other national
#   holiday as a holiday-trading day, which the schedule follows; that holiday
#   trading days from July 2027 hold, as they are scheduled until JPX
#   finalises them in December 2026; that the night session after a business
#   day runs before a holiday; and whether the Friday night sessions before the
#   BCP tests run, which the schedule keeps.

[genesis]
house_capital = "0"

[genesis.params]
profit_fee_bps = 1000
closeout_level_bps = 5000
house_total_cap_bps = 20000
stress_move_window_ms = 60000
stress_cooldown_ms = 300000

[genesis.params.rollover]
tz = "Europe/London"
hour = 22
minute = 0

[genesis.params.toxicity]
horizon_ms = 2000
ewma_weight_bps = 1000
tiers = [
  { min_score_bps = 5, extra_spread_bps = 1 },
  { min_score_bps = 15, extra_spread_bps = 3 },
]

# Level 0 is normal. Higher levels widen spreads, either automatically on
# any trigger or when the operator raises the floor.
[[genesis.params.stress_levels]]
size_spread_multiplier_bps = 10000
min_spread_bps = 0

[[genesis.params.stress_levels]]
size_spread_multiplier_bps = 20000
min_spread_bps = 2
trigger = { divergence_bps = 15, move_bps = 150, utilisation_bps = 8000 }

[[genesis.params.stress_levels]]
size_spread_multiplier_bps = 40000
min_spread_bps = 10
trigger = { divergence_bps = 20, move_bps = 300, utilisation_bps = 9500 }

