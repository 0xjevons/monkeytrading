[workspace]
resolver = "3"
members = ["crates/core", "crates/node"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/0xjevons/monkeytrading"

[workspace.dependencies]
engine-core = { path = "crates/core", version = "0.1.0" }

anyhow = "1"
axum = { version = "0.8", features = ["ws"] }
chrono = { version = "0.4", default-features = false, features = ["std", "serde"] }
chrono-tz = { version = "0.10", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
hex = "0.4"
humantime-serde = "1"
k256 = { version = "0.13", features = ["ecdsa"] }
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha3 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "net", "signal"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
# A panicking task takes the whole node down rather than leaving it running without that task.
panic = "abort"
# Money code: an overflow must halt the engine, never wrap silently.
overflow-checks = true

[profile.dev]
opt-level = 2
lto = "thin"
