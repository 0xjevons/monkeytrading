[workspace]
resolver = "3"
members = ["crates/core", "crates/node"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/0xjevons/monkeytrading"

[workspace.dependencies]
engine-core = { path = "crates/core", version = "0.1.0" }

alloy-dyn-abi = { version = "1.7.3", default-features = false, features = ["std", "eip712"] }
alloy-primitives = { version = "1.7.3", default-features = false, features = ["std", "serde"] }
alloy-sol-types = { version = "1.7.3", default-features = false, features = ["std"] }
anyhow = "1"
axum = { version = "0.8", features = ["ws"] }
# Without `simd-unsafe`, its only source of `unsafe` code.
base64 = { version = "0.23", default-features = false, features = ["std"] }
chrono = { version = "0.4", default-features = false, features = ["std", "serde"] }
chrono-tz = { version = "0.10", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
crc32fast = "1"
ed25519-dalek = "3"
futures-util = { version = "0.3", default-features = false, features = ["alloc", "sink", "std"] }
governor = { version = "0.10", default-features = false, features = ["std", "dashmap"] }
hex = "0.4"
http-body-util = "0.1"
humantime-serde = "1"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
k256 = { version = "0.13", default-features = false, features = ["ecdsa"] }
proptest = { version = "1.12", default-features = false, features = ["std"] }
rand = "0.8"
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring"] }
# TLS for the API and venue feeds with ring as the only crypto provider, so no OpenSSL or aws-lc build.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-webpki = { version = "0.103", default-features = false, features = ["alloc"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
sha3 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "net", "signal", "fs"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
# Venue feeds hand every connection their own rustls config and roots, so this takes only the
# crate's rustls support and none of the root sets it can bundle.
tokio-tungstenite = { version = "0.29", features = ["__rustls-tls"] }
tokio-util = { version = "0.7", features = ["io"] }
toml = "0.8"
tower = { version = "0.5", features = ["util"] }
tower-service = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
webpki-roots = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
# A panicking task takes the whole node down rather than leaving it running without that task.
panic = "abort"
# Money code: an overflow must halt the engine, never wrap silently.
overflow-checks = true

[profile.dev]
opt-level = 2
lto = "thin"
